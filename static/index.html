<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accent Changer — Hear yourself with a perfect English accent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f5f6fa; color: #1d2330; line-height: 1.55;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 24px 16px 60px; }
  .lang-row { text-align: right; }
  .lang-row select {
    background: #fff; border: 1px solid #cfd4e0; border-radius: 999px;
    padding: 6px 12px; font-size: .88rem; color: #444c60; cursor: pointer;
    appearance: auto; font-family: inherit;
  }
  header { text-align: center; margin: 10px 0 28px; }
  header h1 { font-size: 1.9rem; margin-bottom: 6px; }
  header p { color: #5a6274; }
  .card {
    background: #fff; border: 1px solid #e3e6ee; border-radius: 14px;
    padding: 22px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(20,30,60,.05);
  }
  .card h2 { font-size: 1.15rem; margin-bottom: 10px; }
  .card p.hint { color: #5a6274; font-size: .95rem; margin-bottom: 14px; }
  label { display: block; font-size: .9rem; color: #444c60; margin: 10px 0 4px; }
  input[type=email], input[type=password] {
    width: 100%; padding: 10px 12px; border: 1px solid #cfd4e0;
    border-radius: 8px; font-size: 1rem;
  }
  button {
    appearance: none; border: 0; border-radius: 10px; cursor: pointer;
    font-size: 1rem; font-weight: 600; padding: 12px 18px; margin-top: 14px;
  }
  button.primary { background: #3b5bfd; color: #fff; width: 100%; }
  button.primary:disabled { background: #aab4d8; cursor: default; }
  button.record { background: #e94b4b; color: #fff; width: 100%; }
  button.record.stop { background: #333a4d; }
  button.record:disabled { background: #c8ccd8; cursor: default; }
  button.link { background: none; color: #3b5bfd; padding: 6px 4px; font-weight: 500; }
  .status { margin-top: 12px; font-size: .95rem; color: #444c60; min-height: 1.3em; }
  .status.error { color: #c0392b; }
  .status.ok { color: #1e8e4f; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: .9rem; color: #5a6274; flex-wrap: wrap; gap: 4px; }
  .badge { background: #eef1fb; color: #3b5bfd; border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: .85rem; }
  audio { width: 100%; margin-top: 14px; }
  .transcript { margin-top: 12px; background: #f5f6fa; border-radius: 8px; padding: 10px 12px; font-size: .95rem; color: #333a4d; display: none; }
  .hidden { display: none; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 600; }
  .steps { display: flex; flex-direction: column; gap: 14px; }
  .step { display: flex; gap: 14px; align-items: flex-start; }
  .step .num {
    flex: 0 0 34px; height: 34px; border-radius: 50%; background: #eef1fb;
    color: #3b5bfd; font-weight: 700; display: flex; align-items: center;
    justify-content: center; font-size: 1rem;
  }
  .step b { display: block; margin-bottom: 2px; }
  .step p { color: #5a6274; font-size: .93rem; }
  .promise { text-align: center; color: #5a6274; font-size: .9rem; margin-top: 14px; }
  .consent-row { display: flex; gap: 8px; align-items: flex-start; font-size: .92rem; color: #444c60; margin: 4px 0 2px; cursor: pointer; }
  .consent-row input { margin-top: 4px; }
  .hist-item { border-top: 1px solid #eef0f6; padding: 12px 0 6px; }
  .hist-item:first-child { border-top: 0; padding-top: 0; }
  .hist-meta { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: #5a6274; }
  .hist-meta a { color: #3b5bfd; text-decoration: none; font-weight: 600; }
  .hist-text { font-size: .88rem; color: #5a6274; margin-top: 6px; }
  footer { text-align: center; color: #9aa1b3; font-size: .85rem; margin-top: 30px; }
  footer a { color: #9aa1b3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-row">
    <select id="lang-sel" aria-label="Language">
      <option value="en">🌐 English</option>
      <option value="ru">🌐 Русский</option>
    </select>
  </div>

  <header>
    <h1>🎙️ Accent Changer</h1>
    <p id="tagline"></p>
  </header>

  <!-- ===== How it works (logged-out visitors) ===== -->
  <div id="how" class="card hidden">
    <h2 id="how-title"></h2>
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div><b id="s1-t"></b><p id="s1-d"></p></div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div><b id="s2-t"></b><p id="s2-d"></p></div>
      </div>
      <div class="step">
        <div class="num">3</div>
        <div><b id="s3-t"></b><p id="s3-d"></p></div>
      </div>
    </div>
    <p class="promise" id="promise"></p>
  </div>

  <!-- ===== Login / Signup ===== -->
  <div id="auth" class="card hidden">
    <h2 id="auth-title"></h2>
    <p class="hint" id="auth-hint"></p>
    <label id="email-lbl" for="email"></label>
    <input type="email" id="email" autocomplete="email">
    <label id="pass-lbl" for="password"></label>
    <input type="password" id="password" autocomplete="current-password">
    <button class="primary" id="auth-btn"></button>
    <button class="link" id="auth-toggle"></button>
    <button class="link hidden" id="forgot"></button>
    <div class="status" id="auth-status"></div>
  </div>

  <!-- ===== Main app ===== -->
  <div id="app" class="hidden">
    <div class="topbar">
      <span id="who"></span>
      <span><span class="badge" id="quota"></span>
      <button class="link hidden" id="manage"></button>
      <button class="link" id="logout"></button></span>
    </div>

    <div class="card hidden" id="sub-card">
      <h2 id="sub-title"></h2>
      <p class="hint" id="sub-hint"></p>
      <button class="primary" id="sub-btn"></button>
      <div class="status" id="sub-status"></div>
    </div>

    <div class="card" id="clone-card">
      <h2><span id="step1-title"></span> <span id="clone-done"></span></h2>
      <p class="hint" id="step1-hint"></p>
      <label class="consent-row">
        <input type="checkbox" id="consent">
        <span id="consent-lbl"></span>
      </label>
      <button class="record" id="clone-rec"></button>
      <div class="status" id="clone-status"></div>
    </div>

    <div class="card">
      <h2 id="step2-title"></h2>
      <p class="hint" id="step2-hint"></p>
      <button class="record" id="conv-rec"></button>
      <div class="status" id="conv-status"></div>
      <audio id="result" controls class="hidden"></audio>
      <div class="transcript" id="transcript"></div>
    </div>

    <div class="card hidden" id="hist-card">
      <h2 id="hist-title"></h2>
      <div id="hist-list"></div>
    </div>
  </div>

  <footer>
    <span id="footer-line"></span><br>
    <a href="/privacy" id="footer-privacy"></a> ·
    <a href="/terms" id="footer-terms"></a> ·
    <a href="mailto:support@myaccentchanger.com">support@myaccentchanger.com</a>
  </footer>
</div>

    welcome: "Добро пожаловать! Занимайтесь сколько хотите. 🎉",
    footerLine: "Ваши записи используются только для вашего воспроизведения и никому не передаются.",
    privacyLink: "Политика конфиденциальности", termsLink: "Условия использования",
    genericErr: "Что-то пошло не так. Попробуйте ещё раз.",
    histTitle: "Мои записи", download: "Скачать"
  }
};

// Russian versions of messages the server may send
const SERVER_RU = {
  "Please log in first.": "Сначала войдите в аккаунт.",
  "That doesn't look like an email address.": "Это не похоже на адрес эл. почты.",
  "Please use your regular email address — temporary email services are not supported.": "Пожалуйста, используйте ваш обычный адрес — временные почтовые сервисы не поддерживаются.",
  "Password must be at least 8 characters.": "Пароль должен быть не короче 8 символов.",
  "An account with this email already exists. Try logging in.": "Аккаунт с этой почтой уже существует. Попробуйте войти.",
  "Wrong email or password.": "Неверная почта или пароль.",
  "Your free trial is finished — subscribe below to keep going.": "Бесплатные попытки закончились — подпишитесь, чтобы продолжить.",
  "Please confirm that this is your own voice.": "Пожалуйста, подтвердите, что это ваш собственный голос.",
  "That recording is too short. Please record at least 1 minute.": "Запись слишком короткая. Запишите не менее 1 минуты.",

  "That recording is too long. Please keep it under 60 seconds.": "Запись слишком длинная. Уложитесь в 60 секунд.",

  "You've reached this month's fair-use limit of 300 conversions. It resets on the 1st of next month.": "Вы достигли месячного лимита в 300 преобразований. Он обнулится 1-го числа следующего месяца."

let lang = localStorage.getItem("lang") || "en";
if (!T[lang]) lang = "en";
const t = key => T[lang][key];
const trServer = msg => (lang === "ru" && SERVER_RU[msg]) ? SERVER_RU[msg] : msg;

let me = { logged_in: false };
let signupMode = true;

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  $("lang-sel").value = lang;
  $("tagline").textContent = t("tagline");
  $("how-title").textContent = t("howTitle");
  $("s1-t").textContent = t("s1t"); $("s1-d").textContent = t("s1d");
  $("s2-t").textContent = t("s2t"); $("s2-d").textContent = t("s2d");
  $("s3-t").textContent = t("s3t"); $("s3-d").textContent = t("s3d");
  $("promise").textContent = t("promise");
  $("auth-title").textContent = signupMode ? t("authTitleSignup") : t("authTitleLogin");
  $("auth-hint").textContent = t("authHint");
  $("email-lbl").textContent = t("emailLbl");
  $("pass-lbl").textContent = t("passLbl");
  $("auth-btn").textContent = signupMode ? t("signupBtn") : t("loginBtn");
  $("auth-toggle").textContent = signupMode ? t("haveAcct") : t("needAcct");
  $("forgot").textContent = t("forgot");
  $("manage").textContent = t("manage");
  $("logout").textContent = t("logout");
  $("sub-title").textContent = t("subTitle");
  $("sub-hint").textContent = t("subHint");
  $("sub-btn").textContent = t("subBtn");
  $("step1-title").textContent = t("step1Title");
  $("step1-hint").textContent = t("step1Hint");
  $("consent-lbl").textContent = t("consentLbl");
  $("step2-title").textContent = t("step2Title");
  $("step2-hint").textContent = t("step2Hint");
  if (!$("clone-rec").classList.contains("stop") && !$("clone-rec").disabled) {
    $("clone-rec").textContent = me.has_voice ? t("reRecord") : t("record");
  }
  if (!$("conv-rec").classList.contains("stop") && !$("conv-rec").disabled) {
    $("conv-rec").textContent = t("record");
  }
  $("footer-line").textContent = t("footerLine");
  $("footer-privacy").textContent = t("privacyLink");
  $("footer-terms").textContent = t("termsLink");
  $("hist-title").textContent = t("histTitle");
  render();
  loadHistory();
}

$("lang-sel").onchange = () => {
  lang = $("lang-sel").value;
  localStorage.setItem("lang", lang);
  applyLang();
};

function setStatus(el, msg, kind) {
  el.textContent = msg || "";
  el.className = "status" + (kind ? " " + kind : "");
}

function setWorking(on) {
  $("clone-rec").disabled = on;
  $("conv-rec").disabled = on;
}

function render() {
  $("how").classList.toggle("hidden", me.logged_in);
  $("auth").classList.toggle("hidden", me.logged_in);
  $("app").classList.toggle("hidden", !me.logged_in);
  if (!me.logged_in) return;
  $("who").textContent = me.email;
  $("quota").textContent = me.subscribed ? t("subscribed") : t("freeLeft")(me.free_conversions_left);
  $("sub-card").classList.toggle("hidden", me.subscribed || me.free_conversions_left > 0);
  $("manage").classList.toggle("hidden", !me.subscribed);
  $("clone-done").textContent = me.has_voice ? "✅" : "";
  if (!$("clone-rec").classList.contains("stop") && !$("clone-rec").disabled) {
    $("clone-rec").textContent = me.has_voice ? t("reRecord") : t("record");
  }
  if (me.has_voice) setStatus($("clone-status"), t("cloneAlready"), "ok");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadHistory() {
  if (!me.logged_in) return;
  let out;
  try { out = await api("/api/history"); } catch { return; }
  $("hist-card").classList.toggle("hidden", out.items.length === 0);
  $("hist-title").textContent = t("histTitle");
  const list = $("hist-list");
  list.innerHTML = "";
  for (const item of out.items) {
    const when = new Date(item.created_at.replace(" ", "T") + "Z")
      .toLocaleString(lang === "ru" ? "ru-RU" : "en-US", { dateStyle: "medium", timeStyle: "short" });
    const div = document.createElement("div");
    div.className = "hist-item";
    div.innerHTML =
      '<div class="hist-meta"><span>' + when + '</span>' +
      '<a href="/api/recording/' + item.id + '" download>⬇ ' + t("download") + '</a></div>' +
      '<audio controls preload="none" src="/api/recording/' + item.id + '"></audio>' +
      '<div class="hist-text">' + escapeHtml(item.transcript) + '</div>';
    list.appendChild(div);
  }
}

async function api(path, body) {
  const res = await fetch(path, { method: body ? "POST" : "GET", body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(trServer(data.detail || t("genericErr")));
  return data;
}

// ---- recording helper ----
function fmtTime(s) { return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }
function makeRecorder(btn, minSeconds, maxSeconds, onDone) {
  let mediaRecorder = null, chunks = [], startedAt = 0, timerInt = null;
  btn.onclick = async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      onDone(null, t("micBlocked"));
      return;
    }
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(timerInt);
      btn.classList.remove("stop");
      btn.textContent = t("record");
      const seconds = (Date.now() - startedAt) / 1000;
      if (minSeconds && seconds < minSeconds) {
        onDone(null, t("tooShort")(minSeconds));
        return;
      }
      onDone(new Blob(chunks, { type: mediaRecorder.mimeType }), null);
    };
    mediaRecorder.start();
    startedAt = Date.now();
    btn.classList.add("stop");
    timerInt = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      if (s >= maxSeconds && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }
      btn.innerHTML = t("stop") + ' <span class="timer">' + fmtTime(s) + " / " + fmtTime(maxSeconds) + "</span>";
    }, 250);
    btn.textContent = t("stop");
  };
}

// ---- step 1: clone ----
$("clone-rec").addEventListener("click", (e) => {
  if (!$("consent").checked && !$("clone-rec").classList.contains("stop")) {
    e.stopImmediatePropagation();
    setStatus($("clone-status"), t("consentFirst"), "error");
  }
}, true);

makeRecorder($("clone-rec"), 60, 120, async (blob, err) => {
  const st = $("clone-status");
  const resetLabel = () => {
    $("clone-rec").textContent = me.has_voice ? t("reRecord") : t("record");
  };
  if (err) { setStatus(st, err, "error"); resetLabel(); return; }
  setStatus(st, t("cloneWait"));
  setWorking(true);
  $("clone-rec").textContent = t("cloneBtnWait");
  const fd = new FormData();
  fd.append("audio", blob, "sample.webm");
  fd.append("consent", "yes");
  try {
    me = await api("/api/clone", fd);
    render();
    setStatus(st, t("cloneDone"), "ok");
  } catch (e) {
    setStatus(st, e.message, "error");
  } finally {
    setWorking(false);
    resetLabel();
  }
});

// ---- step 2: convert ----
makeRecorder($("conv-rec"), 0, 60, async (blob, err) => {
  const st = $("conv-status");
  if (err) return setStatus(st, err, "error");
  if (!me.has_voice) return setStatus(st, t("doStep1"), "error");
  setStatus(st, t("convWait"));
  setWorking(true);
  const fd = new FormData();
  fd.append("audio", blob, "speech.webm");
  try {
    const out = await api("/api/convert", fd);
    me = out.me; render();
    $("transcript").textContent = t("youSaid") + '"' + out.transcript + '"';
    $("transcript").style.display = "block";
    const player = $("result");
    player.src = "data:audio/mpeg;base64," + out.audio_b64;
    player.classList.remove("hidden");
    player.play();
    setStatus(st, t("convDone"), "ok");
    player.scrollIntoView({ behavior: "smooth", block: "center" });
    loadHistory();
  } catch (e) {
    setStatus(st, e.message, "error");
  } finally {
    setWorking(false);
  }
});

// ---- boot ----
applyLang();
(async () => {
  me = await api("/api/me");
  render();
  loadHistory();
  if (new URLSearchParams(location.search).has("paid") && me.logged_in) await afterPayment();
})();
